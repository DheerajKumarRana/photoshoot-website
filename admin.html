<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vistaar CMS</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin/admin.css?v=2026-10-27a">
</head>
<body>

<!-- Sign in -->
<main class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <p class="brand">Vistaar Content</p>
    <h1>Website editor</h1>
    <label class="fld"><span class="fld-l">Email</span><input id="lgEmail" type="email" autocomplete="username" required></label>
    <label class="fld"><span class="fld-l">Password</span><input id="lgPass" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="lgBtn">Sign in</button>
    <p class="login-msg" id="lgMsg" role="alert"></p>
  </form>
</main>

<!-- Editor -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="side-top">
      <p class="brand">Vistaar Content</p>
      <button class="btn sm ghost side-close" id="sideClose" type="button" aria-label="Close menu">✕</button>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <a class="btn sm ghost" href="index.html" target="_blank" rel="noopener">View website ↗</a>
      <p class="who" id="who"></p>
      <button class="btn sm ghost" type="button" id="signOut">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header class="bar">
      <button class="btn sm ghost menu" id="menu" type="button" aria-label="Open menu">☰</button>
      <div><p class="crumb" id="crumb"></p><h1 id="pageTitle"></h1></div>
      <a class="btn sm" id="viewPage" target="_blank" rel="noopener">View this page ↗</a>
    </header>
    <div class="view" id="view"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/content.js?v=2026-10-27a"></script>
<script src="js/cms-config.js?v=2026-10-27a"></script>
<script src="admin/admin.js?v=2026-10-27a"></script>
</body>
</html>
